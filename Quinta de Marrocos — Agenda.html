<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quinta de Marrocos — Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2D5016;--verde-m:#4A7A28;--verde-c:#8BAF5A;--verde-p:#EDF3E4;
  --dourado:#C4973A;--dourado-c:#F5E8CC;--creme:#FAF7F2;
  --cinza:#6B6B6B;--cinza-c:#E8E4DE;--branco:#FFFFFF;--texto:#1A1A1A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{font-family:'DM Sans',sans-serif;background:var(--creme);color:var(--texto);}
.header{background:var(--verde);padding:1rem 1.1rem .75rem;border-bottom:3px solid var(--dourado);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.55rem;}
.header h1{font-family:'Playfair Display',serif;color:#fff;font-size:1.1rem;font-weight:600;}
.data-hoje{color:var(--verde-c);font-size:.73rem;margin-top:1px;}
.btn-reload{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;font-size:.72rem;font-weight:500;padding:.35rem .8rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.day-tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--verde);}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex:0 0 auto;padding:.45rem .8rem;color:rgba(255,255,255,.55);font-size:.73rem;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-align:center;min-width:50px;transition:all .15s;}
.day-tab.active{color:#fff;border-bottom-color:var(--dourado);}
.day-tab.hoje-tab .dt-num{color:var(--dourado);}
.day-tab .dt-num{font-size:1.05rem;font-weight:600;display:block;font-family:'Playfair Display',serif;}
.day-tab .ev-dot{font-size:.6rem;display:block;margin-top:1px;color:rgba(255,255,255,.4);}
.day-tab .ev-dot.tem{color:var(--dourado);}
.content{padding:.85rem;max-width:520px;margin:0 auto;padding-bottom:72px;}
.loading{text-align:center;padding:3rem 1rem;}
.loading .spin{font-size:2rem;display:block;margin-bottom:.75rem;animation:spin 1.5s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading p{color:var(--cinza);font-size:.85rem;line-height:1.6;}
.erro{background:#fff0f0;border:1.5px solid #f5c0c0;border-radius:12px;padding:1.25rem;text-align:center;margin-top:1rem;}
.erro p{font-size:.82rem;color:#8B2020;line-height:1.6;margin-bottom:.75rem;}
.btn-manual{background:var(--verde);color:#fff;border:none;border-radius:8px;padding:.6rem 1.2rem;font-family:'DM Sans',sans-serif;font-size:.82rem;cursor:pointer;}
input[type=file]{display:none;}
.dia-titulo{padding:.5rem 0 .75rem;}
.dia-titulo h2{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--verde);}
.dia-titulo .sub{font-size:.74rem;color:var(--cinza);margin-top:2px;}
.sem-eventos{background:var(--branco);border:1.5px solid var(--cinza-c);border-radius:12px;padding:1.75rem;text-align:center;color:var(--cinza);font-size:.85rem;}
.sem-eventos span{font-size:1.5rem;display:block;margin-bottom:.4rem;}
.evento{background:var(--branco);border:1.5px solid var(--cinza-c);border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem;border-left:4px solid var(--cinza-c);cursor:pointer;transition:box-shadow .15s;}
.evento.dormida{border-left-color:#1A4A8A;}
.evento.dormida.entrada{border-left-color:#27AE60;background:#F0FBF4;}
.evento.dormida.saida{border-left-color:#E74C3C;background:#FEF5F5;}
.evento.jantar{border-left-color:var(--dourado);}
.evento.almoco{border-left-color:#8B4A1A;}
.evento.visita{border-left-color:var(--verde-m);}
.evento.prova{border-left-color:var(--verde-c);}
.evento.outros{border-left-color:var(--cinza-c);}
/* linha compacta sempre visível */
.ev-linha{display:flex;align-items:center;gap:.5rem;}
.ev-linha-esq{flex:1;min-width:0;}
.ev-linha-dir{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.65rem;font-weight:500;}
.bd{background:#E8F0FB;color:#1A4A8A;}
.bj{background:var(--dourado-c);color:#7A5A10;}
.ba{background:#FBF0E8;color:#8A4A1A;}
.bv{background:var(--verde-p);color:var(--verde);}
.bp{background:#F0F8E8;color:#3A6010;}
.bo{background:var(--cinza-c);color:var(--cinza);}
.entrada-badge{background:#D5F5E3;color:#1A6B3A;padding:1px 7px;border-radius:20px;font-size:.65rem;font-weight:600;}
.saida-badge{background:#FADBD8;color:#8B2020;padding:1px 7px;border-radius:20px;font-size:.65rem;font-weight:600;}
.ev-hora{font-size:.72rem;color:var(--cinza);font-weight:500;white-space:nowrap;}
.ev-nome{font-size:.88rem;font-weight:500;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-sub{font-size:.7rem;color:var(--cinza);margin-top:1px;}
/* detalhe expandido */
.ev-detalhe{display:none;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--cinza-c);}
.evento.aberto .ev-detalhe{display:block;}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.25rem .6rem;margin-bottom:.4rem;}
.ev-item{font-size:.74rem;}
.ev-item .k{color:var(--cinza);font-size:.66rem;display:block;}
.ev-item .v{color:var(--texto);font-weight:500;}
.ev-obs{background:var(--dourado-c);border-radius:6px;padding:.45rem .6rem;font-size:.72rem;color:#5A4010;line-height:1.5;}
.ev-obs strong{display:block;margin-bottom:.1rem;font-size:.68rem;}
.pagar{color:var(--dourado);font-weight:600;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--verde);padding:.55rem 1rem;display:flex;justify-content:center;gap:.5rem;border-top:2px solid var(--dourado);}
.nav-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:.5rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;}
.nav-btn.hoje{background:var(--dourado);}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:2rem;text-align:center;}
.login-screen .logo{font-size:2.5rem;margin-bottom:1rem;}
.login-screen h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--verde);margin-bottom:.5rem;}
.login-screen p{font-size:.82rem;color:var(--cinza);margin-bottom:1.5rem;line-height:1.6;}
.login-input{width:100%;max-width:280px;padding:.75rem 1rem;border:1.5px solid var(--cinza-c);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;text-align:center;letter-spacing:.15em;background:var(--branco);margin-bottom:.75rem;outline:none;}
.login-input:focus{border-color:var(--verde);}
.login-btn{width:100%;max-width:280px;padding:.8rem;background:var(--verde);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;}
.login-btn:hover{background:var(--verde-m);}
.login-erro{color:#8B2020;font-size:.8rem;margin-top:.5rem;display:none;}
.semana-table{width:100%;border-collapse:collapse;font-size:.72rem;}
.semana-table th{background:var(--verde);color:#fff;padding:.4rem .3rem;text-align:center;font-weight:500;font-size:.7rem;position:sticky;top:0;}
.semana-table th.hoje-col{background:var(--dourado);}
.semana-table td{padding:.3rem .3rem;border:1px solid var(--cinza-c);vertical-align:top;min-width:42px;max-width:90px;}
.semana-table tr:nth-child(even) td{background:var(--creme);}
.sem-cell{font-size:.68rem;padding:2px 4px;border-radius:4px;margin-bottom:2px;line-height:1.3;cursor:pointer;}
.sem-cell.dormida{background:#E8F0FB;color:#1A4A8A;border-left:2px solid #1A4A8A;}
.sem-cell.dormida.entrada{background:#D5F5E3;color:#1A6B3A;border-left:2px solid #27AE60;}
.sem-cell.dormida.saida{background:#FADBD8;color:#8B2020;border-left:2px solid #E74C3C;}
.sem-cell.jantar{background:var(--dourado-c);color:#7A5A10;border-left:2px solid var(--dourado);}
.sem-cell.almoco{background:#FBF0E8;color:#8A4A1A;border-left:2px solid #8B4A1A;}
.sem-cell.visita{background:var(--verde-p);color:var(--verde);border-left:2px solid var(--verde-m);}
.sem-cell.prova{background:#F0F8E8;color:#3A6010;border-left:2px solid var(--verde-c);}
.sem-cell.outros{background:var(--cinza-c);color:var(--cinza);border-left:2px solid var(--cinza);}
.sem-nome{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;display:block;}
.sem-hora{color:inherit;opacity:.75;font-size:.63rem;}
.sem-badge-es{font-size:.6rem;font-weight:600;}
</style>
</head>
<body>
<div class="header" id="mainHeader" style="display:none;">
  <div class="header-top">
    <div>
      <h1>🍷 Quinta de Marrocos</h1>
      <div class="data-hoje" id="dataHoje"></div>
    </div>
    <button class="btn-reload" onclick="carregarDados()">↻ Atualizar</button>
    <input type="file" id="fileManual" accept=".xls,.xlsx,.csv" onchange="carregarManual(event)">
  </div>
  <div class="day-tabs" id="dayTabs"></div>
<div style="display:flex;background:var(--verde);border-top:1px solid rgba(255,255,255,.1);">
  <button id="tabDia" onclick="setVista('dia')" style="flex:1;padding:.4rem;font-size:.75rem;font-weight:500;border:none;cursor:pointer;background:var(--dourado);color:#fff;font-family:'DM Sans',sans-serif;">📅 Dia</button>
  <button id="tabSemana" onclick="setVista('semana')" style="flex:1;padding:.4rem;font-size:.75rem;font-weight:500;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;">📆 Semana</button>
</div>
</div>
<div id="loginScreen" class="login-screen">
  <div class="logo">🍷</div>
  <h2>Quinta de Marrocos</h2>
  <p>Introduz a palavra-passe<br>para aceder à agenda</p>
  <input type="password" id="senhaInput" class="login-input" placeholder="••••••" onkeydown="if(event.key==='Enter')verificarSenha()">
  <button class="login-btn" onclick="verificarSenha()">Entrar</button>
  <div class="login-erro" id="loginErro">Palavra-passe incorreta</div>
</div>
<div class="content" id="content" style="display:none;">
  <div class="loading"><span class="spin">🍷</span><p>A carregar marcações...</p></div>
</div>
<div class="bottom-nav" id="mainNav" style="display:none;">
  <button class="nav-btn" onclick="navDia(-1)">← Anterior</button>
  <button class="nav-btn hoje" onclick="irHoje()">Hoje</button>
  <button class="nav-btn" onclick="navDia(1)">Próximo →</button>
</div>
<script>
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_MAP={
  'jan':0,'fev':1,'feb':1,'mar':2,'abr':3,'apr':3,'mai':4,'may':4,'jun':5,
  'jul':6,'ago':7,'aug':7,'set':8,'sep':8,'out':9,'oct':9,'nov':10,'dez':11,'dec':11
};

const CSV_URL='https://script.google.com/macros/s/AKfycbzd-kDBGio2SKgeuDkcz6Kc1hVZrEZWeZiLYTtEI6eCx9NR6wlWzi76Q_bQ_94wX_ZvSg/exec';

let marcacoes=[];
let semana=[];
let diaAtivo=0;
const hoje=new Date();

document.getElementById('dataHoje').textContent=
  DIAS[hoje.getDay()]+', '+hoje.getDate()+' de '+MESES[hoje.getMonth()]+' de '+hoje.getFullYear();

async function carregarDados(){
  document.getElementById('content').innerHTML='<div class="loading"><span class="spin">🍷</span><p>A carregar marcações...</p></div>';
  try{
    const resp=await fetch(CSV_URL);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const buffer=await resp.arrayBuffer();
    const text=new TextDecoder("utf-8").decode(buffer);
    processarCSV(text);
  }catch(e){ mostrarErro(e.message); }
}

function parseCSV(text){
  const lines=text.split('\n');
  const result=[];
  for(const line of lines){
    const row=[];
    let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      } else if(c===','&&!inQ){
        row.push(cur.trim());cur='';
      } else cur+=c;
    }
    row.push(cur.trim());
    result.push(row);
  }
  return result;
}

function processarCSV(text){
  const aoa=parseCSV(text);
  if(aoa.length<2){mostrarErro('Ficheiro vazio');return;}

  // primeira linha é o cabeçalho
  const headers=aoa[0].map(h=>h.trim());
  const colMap={};
  headers.forEach((h,i)=>{if(h) colMap[h]=i;});

  const get=(row,col)=>colMap[col]!==undefined?String(row[colMap[col]]||'').trim():'';

  const rows=[];
  let ultimaData='';
  for(let i=1;i<aoa.length;i++){
    const row=aoa[i];
    if(row.every(c=>!c)) continue;
    let data=get(row,'Data');
    if(data) ultimaData=data; else data=ultimaData;
    const tipo=get(row,'Tipo de Evento');
    if(!data||!tipo) continue;
    rows.push({
      'Data':data,'Tipo de Evento':tipo,
      'Responsável':get(row,'Responsável'),
      'Agência':get(row,'Agência'),
      'Clientes':get(row,'Clientes'),
      'Guia/Motorista':get(row,'Guia/Motorista'),
      'Língua':get(row,'Língua'),
      'Horário':get(row,'Horário'),
      'Local':get(row,'Local'),
      'Noites':get(row,'Noites'),
      'País':get(row,'País'),
      'Pagar na Quinta?':get(row,'Pagar na Quinta?'),
      'Valor a Pagar (€)':get(row,'Valor a Pagar (€)'),
      'Observações':get(row,'Observações'),
    });
  }
  marcacoes=rows;
  gerarSemana(hoje);
  diaAtivo=0;
  renderTabs();
  renderDia();
}

function mostrarErro(msg){
  document.getElementById('content').innerHTML=`
    <div class="erro">
      <p>Não foi possível carregar automaticamente.<br><small>${msg||''}</small><br><br>
      Em alternativa, carrega o ficheiro Excel manualmente:</p>
      <button class="btn-manual" onclick="document.getElementById('fileManual').click()">📂 Carregar ficheiro</button>
    </div>`;
}

function carregarManual(e){
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('content').innerHTML='<div class="loading"><span class="spin">🍷</span><p>A processar...</p></div>';
  const reader=new FileReader();
  if(file.name.endsWith('.csv')){
    reader.onload=ev=>processarCSV(ev.target.result);
    reader.readAsText(file);
  } else {
    reader.onload=ev=>{
      const script=document.createElement('script');
      script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.onload=()=>{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        const sn=wb.SheetNames.find(n=>n.toLowerCase().includes('marca'))||wb.SheetNames[0];
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
        // encontrar cabeçalho
        let hi=-1;
        for(let i=0;i<Math.min(aoa.length,10);i++){
          if(aoa[i].some(c=>String(c).trim()==='Data')&&aoa[i].some(c=>String(c).trim()==='Tipo de Evento')){hi=i;break;}
        }
        if(hi===-1){mostrarErro('Cabeçalho não encontrado');return;}
        const headers=aoa[hi].map(h=>String(h).trim());
        const cm={};headers.forEach((h,i)=>{if(h)cm[h]=i;});
        const get=(row,col)=>cm[col]!==undefined?String(row[cm[col]]||'').trim():'';
        const rows=[];let ud='';
        for(let i=hi+1;i<aoa.length;i++){
          const row=aoa[i];
          if(row.every(c=>String(c).trim()===''))continue;
          let data=get(row,'Data');if(data)ud=data;else data=ud;
          const tipo=get(row,'Tipo de Evento');
          if(!data||!tipo)continue;
          rows.push({'Data':data,'Tipo de Evento':tipo,'Responsável':get(row,'Responsável'),'Agência':get(row,'Agência'),'Clientes':get(row,'Clientes'),'Guia/Motorista':get(row,'Guia/Motorista'),'Língua':get(row,'Língua'),'Horário':get(row,'Horário'),'Local':get(row,'Local'),'Noites':get(row,'Noites'),'País':get(row,'País'),'Pagar na Quinta?':get(row,'Pagar na Quinta?'),'Valor a Pagar (€)':get(row,'Valor a Pagar (€)'),'Observações':get(row,'Observações')});
        }
        marcacoes=rows;gerarSemana(hoje);diaAtivo=0;renderTabs();renderDia();
      };
      document.head.appendChild(script);
    };
    reader.readAsArrayBuffer(file);
  }
}

function parseDateStr(s){
  if(!s)return null;
  const str=String(s).trim();
  // formato 2026/05/24 ou 2026-05-24
  const mISO=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(mISO) return new Date(parseInt(mISO[1]),parseInt(mISO[2])-1,parseInt(mISO[3]));
  // formato 24/05/2026 ou 24-05-2026
  const mPT=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(mPT) return new Date(parseInt(mPT[3]),parseInt(mPT[2])-1,parseInt(mPT[1]));
  // formato "26-mai." ou "26-May"
  const sl=str.toLowerCase();
  const mMes=sl.match(/^(\d{1,2})\s*[-.\/]\s*([a-záéíóúàèìòùâêîôûãõç.]+)/);
  if(mMes){
    const dia=parseInt(mMes[1]);
    const mesStr=mMes[2].replace(/\./g,'').trim().substring(0,3);
    const mesIdx=MESES_MAP[mesStr];
    if(mesIdx!==undefined){
      return new Date(2026,mesIdx,dia);
    }
  }
  const dt=new Date(str);return isNaN(dt)?null:dt;
}

function mesmoDia(a,b){
  return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}

function gerarSemana(base){
  semana=[];
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);semana.push(d);}
}

function eventosDia(data){
  return marcacoes.filter(r=>{
    const dr=parseDateStr(r['Data']);if(!dr)return false;
    const noites=Math.max(1,parseInt(String(r['Noites']).replace(/[^0-9]/g,''))||1);
    const tipo=String(r['Tipo de Evento']||'').toLowerCase();
    if(tipo.includes('dormida')){
      // mostrar no dia de entrada, dias intermédios E dia de saída
      const dataSaida=new Date(dr.getFullYear(),dr.getMonth(),dr.getDate()+noites);
      if(mesmoDia(dr,data))return true; // entrada
      if(mesmoDia(dataSaida,data))return true; // saída
      // dias intermédios
      for(let i=1;i<noites;i++){const d=new Date(dr.getFullYear(),dr.getMonth(),dr.getDate()+i);if(mesmoDia(d,data))return true;}
      return false;
    }
    return mesmoDia(dr,data);
  });
}

function renderTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML='';
  semana.forEach((d,i)=>{
    const n=eventosDia(d).length;
    const isH=mesmoDia(d,hoje);
    const tab=document.createElement('div');
    tab.className='day-tab'+(i===diaAtivo?' active':'')+(isH?' hoje-tab':'');
    tab.innerHTML=`<span class="dt-num">${d.getDate()}</span>${DIAS[d.getDay()]}<span class="ev-dot${n>0?' tem':''}">${n>0?'●'.repeat(Math.min(n,3)):''}</span>`;
    tab.onclick=()=>{diaAtivo=i;renderTabs();renderDia();};
    tabs.appendChild(tab);
  });
}

function tipoClasse(t){
  const s=String(t).toLowerCase();
  if(s.includes('dormida'))return'dormida';
  if(s.includes('jantar'))return'jantar';
  if(s.includes('almoço')||s.includes('almoco'))return'almoco';
  if(s.includes('prova'))return'prova';
  if(s.includes('visita'))return'visita';
  return'outros';
}
function tipoBadge(t){
  return{dormida:'bd',jantar:'bj',almoco:'ba',visita:'bv',prova:'bp',outros:'bo'}[tipoClasse(t)]||'bo';
}

function renderDia(){
  const content=document.getElementById('content');
  content.innerHTML='';
  const data=semana[diaAtivo];
  const evs=eventosDia(data);
  const isH=mesmoDia(data,hoje);
  const titulo=document.createElement('div');
  titulo.className='dia-titulo';
  titulo.innerHTML=`<h2>${isH?'<span style="color:var(--dourado)">Hoje · </span>':''}${DIAS[data.getDay()]}, ${data.getDate()} de ${MESES[data.getMonth()]}</h2><div class="sub">${evs.length===0?'Sem eventos':evs.length+' evento'+(evs.length!==1?'s':'')}</div>`;
  content.appendChild(titulo);
  if(evs.length===0){
    const v=document.createElement('div');v.className='sem-eventos';
    v.innerHTML='<span>🌿</span>Dia sem eventos marcados';
    content.appendChild(v);return;
  }
  evs.sort((a,b)=>{
    const ta=String(a['Tipo de Evento']||'').toLowerCase();
    const tb=String(b['Tipo de Evento']||'').toLowerCase();
    const ha=a['Horário']||'';const hb=b['Horário']||'';
    if(ta.includes('dormida')&&!tb.includes('dormida'))return -1;
    if(!ta.includes('dormida')&&tb.includes('dormida'))return 1;
    if(ha&&hb)return ha.localeCompare(hb);
    if(ha)return -1;if(hb)return 1;
    return 0;
  });
  for(const ev of evs){
    const tipo=ev['Tipo de Evento']||'';
    const tc=tipoClasse(tipo);
    const nome=ev['Responsável']||'—';
    const hora=ev['Horário']||'';
    const local=ev['Local']||'';
    const pessoas=ev['Clientes']||'';
    const lingua=ev['Língua']||'';
    const pais=ev['País']||'';
    const agencia=ev['Agência']||'';
    const noites=Math.max(1,parseInt(String(ev['Noites']).replace(/[^0-9]/g,''))||1);
    const obs=ev['Observações']||'';
    const pagar=String(ev['Pagar na Quinta?']||'').toLowerCase();
    const valor=ev['Valor a Pagar (€)']||'';
    const guia=ev['Guia/Motorista']||'';
    const dataEv=parseDateStr(ev['Data']);

    // calcular entrada/saída para dormidas
    let entradaSaida='';
    let extraClasse='';
    if(tc==='dormida'&&dataEv&&noites>=1){
      const isEntrada=mesmoDia(dataEv,data);
      const dataSaida=new Date(dataEv.getFullYear(),dataEv.getMonth(),dataEv.getDate()+noites);
      const isSaida=mesmoDia(dataSaida,data);
      if(isEntrada&&isSaida){entradaSaida='<span class="entrada-badge">↓ Entrada</span><span class="saida-badge">↑ Saída</span>';extraClasse=' entrada';}
      else if(isEntrada){entradaSaida='<span class="entrada-badge">↓ Entrada</span>';extraClasse=' entrada';}
      else if(isSaida){entradaSaida='<span class="saida-badge">↑ Saída</span>';extraClasse=' saida';}
    }

    // linha resumo sub (local + pessoas)
    const partes=[];
    if(local)partes.push(local);
    if(pessoas)partes.push(pessoas+'p');
    if(lingua)partes.push(lingua);
    if(pais)partes.push(pais);
    const sub=partes.join(' · ');

    let grid='';
    if(local)grid+=`<div class="ev-item"><span class="k">Local</span><span class="v">${local}</span></div>`;
    if(pessoas)grid+=`<div class="ev-item"><span class="k">Pessoas</span><span class="v">${pessoas}</span></div>`;
    if(lingua)grid+=`<div class="ev-item"><span class="k">Língua</span><span class="v">${lingua}</span></div>`;
    if(pais)grid+=`<div class="ev-item"><span class="k">País</span><span class="v">${pais}</span></div>`;
    if(agencia)grid+=`<div class="ev-item"><span class="k">Agência</span><span class="v">${agencia}</span></div>`;
    if(guia)grid+=`<div class="ev-item"><span class="k">Guia</span><span class="v">${guia}</span></div>`;
    if(noites&&tc==='dormida')grid+=`<div class="ev-item"><span class="k">Noites</span><span class="v">${noites}</span></div>`;
    if(pagar==='sim')grid+=`<div class="ev-item"><span class="k">A pagar</span><span class="v pagar">${valor?valor+' €':'Sim'}</span></div>`;

    const card=document.createElement('div');
    card.className=`evento ${tc}${extraClasse}`;
    card.innerHTML=`
      <div class="ev-linha">
        <div class="ev-linha-esq">
          <div class="ev-nome">${nome}</div>
          ${sub?`<div class="ev-sub">${sub}</div>`:''}
        </div>
        <div class="ev-linha-dir">
          ${entradaSaida}
          <span class="badge ${tipoBadge(tipo)}">${tipo}</span>
          ${hora?`<span class="ev-hora">${hora}</span>`:''}
        </div>
      </div>
      <div class="ev-detalhe">
        ${grid?`<div class="ev-grid">${grid}</div>`:''}
        ${obs?`<div class="ev-obs"><strong>📝 Notas</strong>${obs}</div>`:''}
      </div>
    `;
    card.onclick=()=>card.classList.toggle('aberto');
    content.appendChild(card);
  }
}

function navDia(d){
  const novo=diaAtivo+d;
  if(novo>=0&&novo<7){diaAtivo=novo;}
  else{const b=new Date(semana[0]);b.setDate(b.getDate()+d*7);gerarSemana(b);diaAtivo=d>0?0:6;}
  renderTabs();renderDia();
  document.getElementById('dayTabs').querySelectorAll('.day-tab')[diaAtivo]?.scrollIntoView({behavior:'smooth',inline:'center'});
}

function irHoje(){gerarSemana(hoje);diaAtivo=0;renderTabs();renderDia();}

let vistaAtiva='dia';
function setVista(v){
  vistaAtiva=v;
  document.getElementById('tabDia').style.background=v==='dia'?'var(--dourado)':'transparent';
  document.getElementById('tabDia').style.color=v==='dia'?'#fff':'rgba(255,255,255,.7)';
  document.getElementById('tabSemana').style.background=v==='semana'?'var(--dourado)':'transparent';
  document.getElementById('tabSemana').style.color=v==='semana'?'#fff':'rgba(255,255,255,.7)';
  document.getElementById('dayTabs').style.display=v==='dia'?'flex':'none';
  if(v==='dia') renderDia(); else renderSemana();
}

function renderSemana(){
  const content=document.getElementById('content');
  content.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='overflow-x:auto;padding-bottom:72px;';
  const table=document.createElement('table');
  table.className='semana-table';

  // cabeçalho dias
  const thead=document.createElement('thead');
  const trH=document.createElement('tr');
  semana.forEach(d=>{
    const th=document.createElement('th');
    const isH=mesmoDia(d,hoje);
    if(isH)th.classList.add('hoje-col');
    th.innerHTML=`${DIAS[d.getDay()]}<br><span style="font-size:.8rem;font-family:'Playfair Display',serif;">${d.getDate()}</span>`;
    trH.appendChild(th);
  });
  thead.appendChild(trH);
  table.appendChild(thead);

  const eventosPorDia=semana.map(d=>eventosDia(d));

  // === DORMIDAS: uma linha por hóspede ===
  // identificar dormidas únicas (por Responsável + Data)
  const dormidasVistas=new Set();
  const dormidas=[];
  for(let i=0;i<7;i++){
    for(const ev of eventosPorDia[i]){
      if(!String(ev['Tipo de Evento']||'').toLowerCase().includes('dormida'))continue;
      const chave=(ev['Responsável']||'')+'|'+(ev['Data']||'');
      if(!dormidasVistas.has(chave)){dormidasVistas.add(chave);dormidas.push(ev);}
    }
  }
  dormidas.sort((a,b)=>{const da=parseDateStr(a['Data']);const db=parseDateStr(b['Data']);return da&&db?da-db:0;});

  const tbody=document.createElement('tbody');

  if(dormidas.length>0){
    // separador dormidas
    const trSep=document.createElement('tr');
    const tdSep=document.createElement('td');
    tdSep.colSpan=7;tdSep.style.cssText='background:var(--verde);color:#fff;font-size:.65rem;font-weight:600;padding:3px 6px;text-transform:uppercase;letter-spacing:.05em;';
    tdSep.textContent='🛏 Dormidas';trSep.appendChild(tdSep);tbody.appendChild(trSep);

    for(const ev of dormidas){
      const nome=ev['Responsável']||'—';
      const noites=Math.max(1,parseInt(String(ev['Noites']).replace(/[^0-9]/g,''))||1);
      const dataEv=parseDateStr(ev['Data']);
      const tr=document.createElement('tr');
      for(let i=0;i<7;i++){
        const td=document.createElement('td');
        // verificar se este hóspede está neste dia
        const evNesteDia=eventosPorDia[i].find(e=>
          e['Responsável']===ev['Responsável']&&
          String(e['Tipo de Evento']||'').toLowerCase().includes('dormida')&&
          e['Data']===ev['Data']
        );
        if(evNesteDia&&dataEv){
          const isEntrada=mesmoDia(dataEv,semana[i]);
          const dataSaida=new Date(dataEv.getFullYear(),dataEv.getMonth(),dataEv.getDate()+noites);
          const isSaida=mesmoDia(dataSaida,semana[i]);
          const cell=document.createElement('div');
          let cls='sem-cell dormida';
          let prefix='';
          if(isEntrada&&isSaida){cls+=' entrada';prefix='↓↑ ';}
          else if(isEntrada){cls+=' entrada';prefix='↓ ';}
          else if(isSaida){cls+=' saida';prefix='↑ ';}
          cell.className=cls;
          cell.innerHTML=`<span class="sem-nome">${prefix}${nome}</span>`;
          cell.onclick=()=>{diaAtivo=i;setVista('dia');};
          td.appendChild(cell);
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  // === EVENTOS por período, agrupados por horário ===
  function periodoHora(h){
    if(!h)return 5;
    const m=h.match(/^(\d{1,2})[:.]/);
    if(!m)return 5;
    const hr=parseInt(m[1]);
    if(hr<12)return 1;if(hr<14)return 2;if(hr<17)return 3;return 4;
  }
  const periodos=[
    {id:1,label:'🌅 Manhã'},{id:2,label:'☀️ Almoço'},
    {id:3,label:'🌤 Tarde'},{id:4,label:'🌙 Noite'},{id:5,label:'📋 Sem hora'}
  ];

  // eventos não-dormida — agrupar por horário normalizado
  const horariosMap=new Map(); // horario -> [{ev, diaIdx}]
  for(let i=0;i<7;i++){
    for(const ev of eventosPorDia[i]){
      if(String(ev['Tipo de Evento']||'').toLowerCase().includes('dormida'))continue;
      const h=ev['Horário']||'__semhora__';
      if(!horariosMap.has(h))horariosMap.set(h,[]);
      // evitar duplicados (mesmo evento em vários dias da semana via herança de data)
      const jaExiste=horariosMap.get(h).find(x=>
        x.ev['Responsável']===ev['Responsável']&&
        x.ev['Tipo de Evento']===ev['Tipo de Evento']&&
        x.ev['Data']===ev['Data']&&
        x.diaIdx===i
      );
      if(!jaExiste)horariosMap.get(h).push({ev,diaIdx:i});
    }
  }

  // ordenar horários por período e hora
  const horariosOrdenados=[...horariosMap.keys()].sort((a,b)=>{
    const pa=periodoHora(a==='__semhora__'?'':a);
    const pb=periodoHora(b==='__semhora__'?'':b);
    if(pa!==pb)return pa-pb;
    return a.localeCompare(b);
  });

  let periodoAtual=0;
  for(const horario of horariosOrdenados){
    const evsDaHora=horariosMap.get(horario);
    const p=periodoHora(horario==='__semhora__'?'':horario);

    // separador de período
    if(p!==periodoAtual){
      periodoAtual=p;
      const trSep=document.createElement('tr');
      const tdSep=document.createElement('td');
      tdSep.colSpan=7;tdSep.style.cssText='background:var(--verde);color:#fff;font-size:.65rem;font-weight:600;padding:3px 6px;text-transform:uppercase;letter-spacing:.05em;';
      tdSep.textContent=periodos.find(p2=>p2.id===p)?.label||'';
      trSep.appendChild(tdSep);tbody.appendChild(trSep);
    }

    // uma linha para este horário — todos os eventos dessa hora distribuídos pelos dias
    const tr=document.createElement('tr');
    for(let i=0;i<7;i++){
      const td=document.createElement('td');
      const evsDiaNaHora=evsDaHora.filter(x=>x.diaIdx===i);
      for(const {ev} of evsDiaNaHora){
        const tc=tipoClasse(ev['Tipo de Evento']||'');
        const nome=ev['Responsável']||ev['Tipo de Evento']||'—';
        const hora=horario==='__semhora__'?'':horario;
        const cell=document.createElement('div');
        cell.className=`sem-cell ${tc}`;
        cell.innerHTML=`<span class="sem-nome">${nome}</span>${hora?`<span class="sem-hora">${hora}</span>`:''}`;
        cell.onclick=()=>{diaAtivo=i;setVista('dia');};
        td.appendChild(cell);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  wrap.appendChild(table);
  content.appendChild(wrap);
}

// === AUTENTICAÇÃO ===
const SENHA='quinta2026'; // muda esta palavra-passe quando necessário

function verificarSenha(){
  const input=document.getElementById('senhaInput').value;
  if(input===SENHA){
    sessionStorage.setItem('qm_auth','1');
    mostrarApp();
  } else {
    document.getElementById('loginErro').style.display='block';
    document.getElementById('senhaInput').value='';
    document.getElementById('senhaInput').focus();
  }
}

function mostrarApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('mainHeader').style.display='block';
  document.getElementById('mainNav').style.display='flex';
  carregarDados();
}

// verificar se já tem sessão ativa
if(sessionStorage.getItem('qm_auth')==='1'){
  mostrarApp();
} else {
  // mostrar ecrã de login — header e nav já estão escondidos
}
</script>
